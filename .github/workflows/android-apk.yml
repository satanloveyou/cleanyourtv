name: Build fixed Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Test and build CleanYourTV 3.6
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run tests, lint and build release APK
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-3.6-fixed-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
